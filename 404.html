<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page not found | InnovationLet</title>
	<meta name="robots" content="noindex, follow">
	<meta name="theme-color" content="#07080a">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root { --canvas: #07080a; --ink: #f4f4f6; --body: #cdcdcd; --mute: #9c9c9d; --hair: #242728; }
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; background: var(--canvas); color: var(--body);
			font-family: Inter, system-ui, -apple-system, sans-serif;
			display: flex; align-items: center; justify-content: center; padding: 24px;
		}
		.card {
			max-width: 520px; width: 100%; text-align: center;
			border: 1px solid var(--hair); border-radius: 16px; padding: 48px 32px;
		}
		.mark {
			display: inline-flex; align-items: center; justify-content: center;
			width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--hair);
			background: #121212; color: var(--ink); font-weight: 600; margin-bottom: 24px;
		}
		h1 { color: var(--ink); font-size: 28px; margin: 0 0 12px; letter-spacing: -0.01em; }
		p { margin: 0 0 28px; line-height: 1.6; }
		a.btn {
			display: inline-block; background: #ffffff; color: #000000; text-decoration: none;
			font-weight: 600; padding: 10px 20px; border-radius: 999px;
		}
		a.link { color: var(--mute); text-decoration: none; display: block; margin-top: 20px; }
		a.link:hover { color: var(--ink); }
	</style>
</head>
<body>
	<main class="card">
		<span class="mark">iL</span>
		<h1>Page not found</h1>
		<p>The page you were looking for is not here. It may have moved, or the link was wrong.</p>
		<a class="btn" href="/">Back to InnovationLet</a>
		<a class="link" href="/#categories">Browse all desks</a>
	</main>
</body>
</html>
